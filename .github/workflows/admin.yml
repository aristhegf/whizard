name: Admins

# Makes an account an admin (it can open /admin), or takes that away. Run it from the Actions
# tab with the account's username.
on:
  workflow_dispatch:
    inputs:
      username:
        description: Username, without the @
        required: true
      action:
        description: grant or revoke
        type: choice
        options: [grant, revoke]
        default: grant

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update the account
        working-directory: apps/server
        env:
          USERNAME: ${{ inputs.username }}
          ACTION: ${{ inputs.action }}
        run: |
          ./scripts/use-remote-db.sh
          node scripts/set-admin.mjs "$USERNAME" "$ACTION"
