name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main part-way through, so a deploy can't be cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
          fi
      - uses: actions/checkout@v7
        if: steps.credentials.outputs.ready
      - uses: pnpm/action-setup@v6
        if: steps.credentials.outputs.ready
      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.ready
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.ready
      - name: Prepare the database
        if: steps.credentials.outputs.ready
        working-directory: apps/server
        run: |
          find_id() { pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name == "whizard") | .uuid'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            pnpm exec wrangler d1 create whizard --location weur --update-config=false
            id=$(find_id)
          fi
          if [ -z "$id" ]; then echo "::error::Couldn't find or create the D1 database"; exit 1; fi
          echo "D1 database: $id"
          sed -i -E "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$id\"/" wrangler.jsonc
          pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy to Cloudflare
        id: deploy
        if: steps.credentials.outputs.ready
        run: |
          set -o pipefail
          pnpm run deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live site
        if: steps.credentials.outputs.ready
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$URL/" | grep -q "<title>Whizard</title>"
          curl -fsS "$URL/api/health" | grep -q '"ok":true'
          curl -fsS "$URL/api/quiz/categories" | grep -q '"id":"bible"'
          curl -fsS -X POST "$URL/api/rooms" | grep -qE '"code":"[A-Z0-9]{6}"'
          curl -fsS "$URL/api/me" | grep -q '"user":null'
          echo "Live at $URL"
