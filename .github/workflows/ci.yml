name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main part-way through, so a deploy can't be cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A push to main is a merged PR whose checks and browser tests already passed on the PR, so it
# only builds and deploys (the deploy step builds the app first). Pull requests, and runs started
# by hand, do everything.
jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The browser tests, split across three machines that run side by side (about a third of the
  # time each). Skipped on pushes to main, where the PR already ran them.
  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Deploys each PR to a separate disposable worker so it can be previewed live.
  # Production keeps serving the deploy job on main, which is untouched here.
  preview:
    needs: [check]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping preview: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
          fi
      - uses: actions/checkout@v7
        if: steps.credentials.outputs.ready
      - uses: pnpm/action-setup@v6
        if: steps.credentials.outputs.ready
      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.ready
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.ready
      - name: Point at the remote database
        if: steps.credentials.outputs.ready
        working-directory: apps/server
        run: ./scripts/use-remote-db.sh
      - name: Build the app
        if: steps.credentials.outputs.ready
        run: pnpm build
      # Version preview URLs aren't generated for workers with Durable Objects, so each PR
      # deploys to a separate disposable worker instead. The production worker is untouched.
      - name: Deploy the preview worker
        id: upload
        if: steps.credentials.outputs.ready
        working-directory: apps/web
        run: |
          set -o pipefail
          pnpm exec wrangler delete whizard-pr-preview --force 2> /dev/null || true
          pnpm exec wrangler deploy --name whizard-pr-preview 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$url" ]; then
            echo "::error::Preview deploy finished but no URL was printed."
            exit 1
          fi
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url/" | grep -q "<title>Whizard</title>"
          curl -fsS --retry 3 --retry-delay 3 --retry-all-errors "$url/api/health" | grep -q '"ok":true'
          echo "Preview live at $url"
      - name: Comment the preview URL on the PR
        if: steps.credentials.outputs.ready && steps.upload.outputs.url != ''
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- whizard-preview -->";
            const url = "${{ steps.upload.outputs.url }}";
            const body = `${marker}\n**Preview deployment:** ${url}\n\n_Deployed as a separate disposable Cloudflare worker — production is untouched. It shares the production database, so anything you create in the preview is live._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # On a push to main, check and e2e are skipped and the deploy goes ahead; on a run started by
  # hand it waits for them, and any failure stops it.
  deploy:
    needs: [check, e2e]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
          fi
      - uses: actions/checkout@v7
        if: steps.credentials.outputs.ready
      - uses: pnpm/action-setup@v6
        if: steps.credentials.outputs.ready
      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.ready
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.ready
      - name: Prepare the database
        if: steps.credentials.outputs.ready
        working-directory: apps/server
        env:
          CREATE_IF_MISSING: "1"
        run: |
          ./scripts/use-remote-db.sh
          pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy to Cloudflare
        id: deploy
        if: steps.credentials.outputs.ready
        run: |
          set -o pipefail
          pnpm run deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live site
        if: steps.credentials.outputs.ready
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -x
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$URL/" | grep -q "<title>Whizard</title>"
          curl -fsS "$URL/api/health" | grep -q '"ok":true'
          curl -fsS "$URL/api/quiz/categories" | grep -q '"id":"bible"'
          curl -fsS -X POST -H "X-Whizard-Smoke-Test: 1" "$URL/api/rooms" | grep -qE '"code":"[A-Z0-9]{6}"'
          presence=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/presence")
          echo "Presence without an upgrade: $presence"
          test "$presence" = 426
          # The database can take a few seconds to settle after a migration.
          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$URL/api/stats?range=7" | grep -q '"range":7'
          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$URL/api/me" | grep -q '"user":null'
          echo "Live at $URL"
