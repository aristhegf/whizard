name: Add questions

on:
  workflow_dispatch:
    inputs:
      category:
        description: Category
        type: choice
        default: all
        options:
          - all
          - bible
          - geography
          - history
          - science
          - animals
          - football
          - movies
          - music
          - nigerian-culture
          - general-knowledge
          - pop-culture
      level:
        description: Level
        type: choice
        default: all
        options: [all, easy, medium, hard]
      count:
        description: Questions to add for each category and level
        type: number
        default: 10

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: add-questions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CATEGORY: ${{ inputs.category }}
      LEVEL: ${{ inputs.level }}
      COUNT: ${{ inputs.count }}
    steps:
      - name: Check for the API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an ANTHROPIC_API_KEY repository secret to generate questions."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate and verify questions
        run: pnpm content:generate --category "$CATEGORY" --level "$LEVEL" --count "$COUNT"
      - name: Check the whole question bank
        run: pnpm test && pnpm format:check
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- packages/content/src/questions; then
            echo "::notice::No new questions passed the checks this time."
            exit 0
          fi
          branch="questions/${CATEGORY}-${LEVEL}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/content/src/questions
          git commit -m "Add ${CATEGORY} ${LEVEL} quiz questions"
          git push origin "$branch"
          body="New questions from run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Each one passed validation, the duplicate check and an independent answer check, and the full test suite passed. Please skim them before merging."
          gh pr create --base main --head "$branch" --title "Add quiz questions (${CATEGORY}, ${LEVEL})" --body "$body" \
            || echo "::warning::Pushed ${branch} but couldn't open the pull request. Allow Actions to create pull requests in Settings → Actions → General, or open it from the branch."
